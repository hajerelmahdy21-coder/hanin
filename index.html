<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Bestie</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cairo:wght@400;600;700;800&family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        salmon: {
                            50: '#FFF5F2',
                            100: '#FFEBE6',
                            200: '#FFD7CD',
                            300: '#FFB8A5',
                            400: '#FF9478',
                            500: '#FF704D',
                            600: '#E65330',
                        },
                        deep: '#3D2522'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                        script: ['Alex Brush', 'cursive']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFF9F7;
            color: #3D2522;
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: #ffffff;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .stage {
            display: none;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stage.active {
            display: flex;
            opacity: 1;
        }

        .glow-shadow {
            filter: drop-shadow(0 4px 15px rgba(255, 112, 77, 0.3));
        }

        .hero-text-shadow {
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 0, 0, 0.6);
        }

        .flame {
            animation: flicker 0.15s infinite alternate ease-in-out;
            transform-origin: center bottom;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-1deg); }
            100% { transform: scale(1.08) rotate(1deg); }
        }

        .flame.off {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen bg-salmon-50/40 relative select-none">

    <!-- Audio Element -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://ia801503.us.archive.org/15/items/SanaHelwaYaJameel/SanaHelwaYaJameel.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating Music Toggle -->
    <button id="music-btn" class="fixed top-5 left-5 z-50 w-12 h-12 rounded-full bg-white/90 shadow-lg border border-salmon-200 text-salmon-500 flex items-center justify-center transition-all duration-300 active:scale-95 hidden">
        <span id="music-icon" class="text-2xl">🎵</span>
    </button>

    <!-- App Wrapper -->
    <main class="w-full min-h-screen relative overflow-hidden flex flex-col justify-between">

        <!-- 1. INTRO & COVER STAGE -->
        <section id="stage-intro" class="stage active min-h-screen w-full flex-col justify-between relative p-6">
            <img id="intro-photo" src="ل.jpeg" class="absolute inset-0 w-full h-full object-cover z-0" alt="Bestie Photo">

            <div class="z-10"></div>

            <!-- Center: Typewriter Text -->
            <div class="z-10 my-auto text-center px-4 w-full">
                <h1 id="typewriter-text" dir="ltr" class="font-serif text-4xl sm:text-5xl text-white font-bold hero-text-shadow leading-relaxed min-h-[100px] flex items-center justify-center flex-wrap"></h1>
            </div>

            <!-- Bottom Button -->
            <div class="z-10 mb-10 text-center w-full px-4">
                <button id="start-btn" class="w-full max-w-xs bg-salmon-500 hover:bg-salmon-600 active:scale-95 text-white font-bold text-xl py-4 rounded-full shadow-2xl border-2 border-white/40 transition-all duration-300 flex items-center justify-center gap-2 mx-auto tracking-wide">
                    <span>دوسي هنا يا بطه</span>
                </button>
            </div>
        </section>

        <!-- 2. COUNTDOWN STAGE -->
        <section id="stage-countdown" class="stage min-h-screen w-full flex-col items-center justify-center relative p-6 bg-white">
            <div class="relative flex items-center justify-center">
                <div class="w-56 h-56 rounded-full border-4 border-salmon-100 border-t-salmon-500 animate-spin"></div>
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span class="font-sans text-sm tracking-widest text-salmon-400 font-bold uppercase mb-2">GET READY</span>
                    <span id="countdown-num" class="font-serif text-8xl font-bold text-salmon-500 glow-shadow">3</span>
                </div>
            </div>
        </section>

        <!-- 3. RAPID MOBILE PHOTO GALLERY STAGE -->
        <section id="stage-gallery" class="stage min-h-screen w-full flex-col justify-between relative p-5 bg-salmon-50">
            <div class="pt-4 px-2 flex items-center justify-between z-10 w-full max-w-md mx-auto">
                <div>
                    <span class="text-xs font-bold tracking-widest text-salmon-400 uppercase">MEMORIES</span>
                    <h2 class="text-2xl font-bold text-deep">ذكرياتنا سوا ❤️</h2>
                </div>
                <div class="text-base font-bold text-salmon-500 bg-white px-4 py-1.5 rounded-full shadow-sm border border-salmon-100">
                    <span id="gallery-counter">1</span> / <span id="gallery-total">5</span>
                </div>
            </div>

            <div class="w-full max-w-md mx-auto bg-salmon-200/50 h-2 rounded-full overflow-hidden my-4 z-10 flex gap-1">
                <div id="progress-bar" class="h-full bg-salmon-500 rounded-full transition-all duration-100 w-0"></div>
            </div>

            <!-- Gallery Image Container -->
            <div class="flex-1 my-auto flex items-center justify-center py-2 relative w-full">
                <div class="w-full max-w-md h-[480px] bg-white p-4 rounded-3xl shadow-xl border border-salmon-100 flex flex-col justify-between relative overflow-hidden">
                    <img id="gallery-img" src="" class="w-full h-[390px] object-cover rounded-2xl transition-all duration-500 shadow-inner" alt="Memory Photo">
                    <p id="gallery-caption" class="text-center text-deep font-bold text-base mt-2 my-auto"></p>
                </div>
            </div>

            <div class="text-center pb-4 text-sm font-semibold text-salmon-400">

            </div>
        </section>

        <!-- 4. FINAL BIRTHDAY LETTER & CANDLE STAGE -->
        <section id="stage-letter" class="stage min-h-screen w-full flex-col justify-center items-center relative p-5 bg-salmon-50/60">
            <div class="w-full max-w-md bg-white rounded-3xl p-7 shadow-2xl border border-salmon-100 text-center relative overflow-hidden my-auto">
                <div class="w-20 h-1.5 bg-salmon-200 rounded-full mx-auto mb-6"></div>

                <div id="cake-area" class="relative w-16 h-20 mx-auto mb-3 cursor-pointer">
                    <div id="flame" class="flame absolute -top-4 left-1/2 -translate-x-1/2 w-4 h-7 bg-gradient-to-t from-orange-500 via-amber-400 to-yellow-200 rounded-full shadow-[0_0_15px_#ff9478]"></div>
                    <div class="w-1 h-3 bg-gray-600 mx-auto rounded-t-sm"></div>
                    <div class="w-4 h-12 bg-gradient-to-r from-salmon-300 via-salmon-200 to-salmon-300 mx-auto rounded-t-md shadow-inner"></div>
                </div>
                <p id="candle-hint" class="text-xs font-bold text-salmon-500 mb-6">اتمنى امنيه واطفى الشمعه (دوسي عليها)</p>

                <h2 class="text-2xl sm:text-3xl font-extrabold text-deep mb-4">إلى حنتى ❤️</h2>
                <div class="text-deep/90 text-base leading-relaxed space-y-3 mb-6 text-right font-semibold">
                    <p>كل سنة وأنتي طيبة وبخير يابطه!</p>
                    <p>وجودك في حياتي نعمة كبيرة ربنا يديمها، يارب السنة دي تكون كلها فرح ونجاح وتحققي كل اللي بتتمنيه </p>
                    <p class="text-center font-serif text-salmon-500 font-bold text-lg pt-2" dir="ltr">Happy Birthday My Beautiful Girl!</p>
                </div>

                <div class="border-t border-salmon-100 pt-4 text-xs font-semibold text-deep/70">
                    <span>دائماً وأبداً، </span>
                    <span class="font-bold text-salmon-500 text-sm">صديقتك الصدوقة</span>
                </div>
            </div>
        </section>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const galleryData = [
                {
                    url: "h.jpeg",
                    caption: "أول ضحكة وذكرياتنا الحلوة سوا ❤️"
                },
                {
                    url: "f.jpeg",
                    caption: "القعدة اللي ما تشبعش منها ✨"
                },
                {
                    url: "g.jpeg",
                    caption: "كل لحظة معاكي ليها طعم تاني ❤️"
                },
                {
                    url: "l.jpeg",
                    caption: "أحلى صاحبة في الدنيا كلها ✨"
                },
                {
                    url: "ع.jpeg",
                    caption: "اضحكى ... دايما ضحكتك حلوه ❤️"
                }
            ];

            const stageIntro = document.getElementById("stage-intro");
            const stageCountdown = document.getElementById("stage-countdown");
            const stageGallery = document.getElementById("stage-gallery");
            const stageLetter = document.getElementById("stage-letter");

            const typewriterText = document.getElementById("typewriter-text");
            const startBtn = document.getElementById("start-btn");
            const countdownNum = document.getElementById("countdown-num");

            const bgMusic = document.getElementById("bg-music");
            const musicBtn = document.getElementById("music-btn");
            const musicIcon = document.getElementById("music-icon");

            const galleryImg = document.getElementById("gallery-img");
            const galleryCaption = document.getElementById("gallery-caption");
            const galleryCounter = document.getElementById("gallery-counter");
            const galleryTotal = document.getElementById("gallery-total");
            const progressBar = document.getElementById("progress-bar");

            let isPlaying = false;

            const textToType = "Happy Birthday Bestie ";
            let charIndex = 0;

            function typeNextChar() {
                if (charIndex < textToType.length) {
                    const currentChar = textToType.charAt(charIndex);
                    const cursor = typewriterText.querySelector(".cursor-blink");

                    if (cursor) {
                        cursor.insertAdjacentHTML('beforebegin', currentChar);
                    } else {
                        typewriterText.innerHTML = currentChar + '<span class="cursor-blink"></span>';
                    }

                    charIndex++;
                    setTimeout(typeNextChar, 110);
                }
            }

            typewriterText.innerHTML = '<span class="cursor-blink"></span>';
            setTimeout(typeNextChar, 400);

            function playAudio() {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicIcon.textContent = "🔊";
                    musicBtn.classList.remove("hidden");
                }).catch(() => { });
            }

            musicBtn.addEventListener("click", () => {
                if (isPlaying) {
                    bgMusic.pause();
                    musicIcon.textContent = "🎵";
                    isPlaying = false;
                } else {
                    bgMusic.play();
                    musicIcon.textContent = "🔊";
                    isPlaying = true;
                }
            });

            function goToStage(fromStage, toStage) {
                fromStage.classList.remove("active");
                setTimeout(() => {
                    fromStage.style.display = "none";
                    toStage.style.display = "flex";
                    setTimeout(() => {
                        toStage.classList.add("active");
                    }, 50);
                }, 800);
            }

            startBtn.addEventListener("click", () => {
                playAudio();
                goToStage(stageIntro, stageCountdown);
                startCountdown();
            });

            function startCountdown() {
                let count = 3;
                const countInterval = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownNum.textContent = count;
                    } else {
                        clearInterval(countInterval);
                        goToStage(stageCountdown, stageGallery);
                        startGallery();
                    }
                }, 1000);
            }

            let currentGalleryIndex = 0;
            galleryTotal.textContent = galleryData.length;

            function startGallery() {
                showGallerySlide(currentGalleryIndex);

                const slideDuration = 4000;
                let progress = 0;

                const progressInterval = setInterval(() => {
                    progress += 2;
                    progressBar.style.width = progress + "%";

                    if (progress >= 100) {
                        progress = 0;
                        currentGalleryIndex++;

                        if (currentGalleryIndex < galleryData.length) {
                            showGallerySlide(currentGalleryIndex);
                        } else {
                            clearInterval(progressInterval);
                            goToStage(stageGallery, stageLetter);
                            triggerConfetti();
                        }
                    }
                }, slideDuration / 50);
            }

            function showGallerySlide(index) {
                galleryImg.src = galleryData[index].url;
                galleryCaption.textContent = galleryData[index].caption;
                galleryCounter.textContent = index + 1;
            }

            const cakeArea = document.getElementById("cake-area");
            const flame = document.getElementById("flame");
            const candleHint = document.getElementById("candle-hint");

            cakeArea.addEventListener("click", () => {
                flame.classList.add("off");
                candleHint.textContent = "اتمنيتي أمنيتك! كل سنة وأنتي طيبة ✨";
                triggerConfetti();
            });

            function triggerConfetti() {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#FF704D', '#FFB8A5', '#FFFFFF']
                    });
                }
            }
        });
    </script>
</body>

</html>
